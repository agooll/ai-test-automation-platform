name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpoppler-cpp-dev tesseract-ocr
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -r requirements.txt
        pip install -e .
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=testteller --cov-report=xml --cov-report=term-missing -m "unit or automation"

    - name: Run Stage 4 Quality Gate & Anti-Fake Evaluation
      run: |
        python evals/run_quality_eval.py

    - name: Run Stage 5 RAG Grounding & Traceability Evaluation
      run: |
        python evals/run_grounding_eval.py
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unit
        name: unit-tests-${{ matrix.python-version }}
        fail_ci_if_error: false

  docker-integration:
    name: Docker Sandbox Integration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpoppler-cpp-dev tesseract-ocr

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -r requirements.txt
        pip install -e .

    - name: Build Runner Docker Images
      run: |
        python docker/build_runners.py

    - name: Verify Built Runner Images
      run: |
        docker images | grep testteller-runner

    - name: Run Real Docker Sandbox Integration Tests
      id: run_tests
      continue-on-error: true
      run: |
        pytest tests/integration/test_docker_sandbox_real.py -v -s --tb=short | tee test_output.log

    - name: Publish Test Summary
      if: always()
      run: |
        echo "### Docker Sandbox Integration Test Output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test_output.log >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
          exit 1
        fi
 